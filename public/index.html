<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow - Academic Workload &amp; Focus Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <h1>MindFlow</h1>
        <p>Academic Workload &amp; Focus Tracker</p>
    </header>

    <main class="container">
        <!-- Each team member adds their own feature section below -->

        <!-- Member 1 (Jared Aw): Log Focus Session -->
        <section class="card" id="logSessionSection">
            <h2>Log Focus Session</h2>
            <form id="logSessionForm" novalidate>
                <div class="form-group">
                    <label for="sessionSubject">Subject</label>
                    <input type="text" id="sessionSubject" maxlength="50" placeholder="e.g. DevOps Essentials">
                </div>
                <div class="form-group">
                    <label for="sessionDate">Date</label>
                    <input type="date" id="sessionDate">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="sessionStart">Start time</label>
                        <input type="time" id="sessionStart">
                    </div>
                    <div class="form-group">
                        <label for="sessionEnd">End time</label>
                        <input type="time" id="sessionEnd">
                    </div>
                </div>
                <p id="durationPreview" class="duration">Duration: -</p>
                <button type="submit" class="btn-primary">Log Session</button>
            </form>
            <div id="sessionMessage" class="message" role="alert"></div>
        </section>

        <!-- Member 2: Create Workload Task -->

        <!-- Member 3 (Vineet): Update Focus Session -->
        <section id="update-session-section">
            <h2>Update Focus Session</h2>
            <form id="update-session-form" novalidate>
                <label for="update-session-id">Session ID</label>
                <input type="text" id="update-session-id" placeholder="e.g. 101" required>

                <label for="update-subject">Subject</label>
                <input type="text" id="update-subject" placeholder="e.g. Math revision" required>

                <label for="update-date">Date</label>
                <input type="date" id="update-date" required>

                <label for="update-start-time">Start time</label>
                <input type="time" id="update-start-time" required>

                <label for="update-end-time">End time</label>
                <input type="time" id="update-end-time" required>

                <label for="update-notes">Notes (optional)</label>
                <textarea id="update-notes" rows="3" placeholder="e.g. Chapter 4 practice questions"></textarea>

                <button type="submit">Update Session</button>
            </form>
            <p id="update-message" class="message" role="alert"></p>
        </section>
    </main>

    <!-- Each team member adds their own script tag below -->
    <script src="js/jared-aw.js"></script>
    <script src="js/vineet.js"></script>
</body>
</html>
